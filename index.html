<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Для самого лучшего папы</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF6DD;--ink:#1F3A5F;--soft:#5B7391;--card:#FFFFFF;--pink:#FF5C7A;--sun:#FFC93C;--line:#F3DFA6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14213A;--ink:#FFF3D1;--soft:#B5C4DD;--card:#1E3052;--line:#34486E}}
:root[data-theme="dark"]{--bg:#14213A;--ink:#FFF3D1;--soft:#B5C4DD;--card:#1E3052;--line:#34486E}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.6 Nunito,system-ui,sans-serif;min-height:100vh}
h1,h2{font-family:Pacifico,"Comic Sans MS",cursive;font-weight:400;line-height:1.25;margin:0;text-align:center}
.screen{display:none;max-width:900px;margin:0 auto;padding:24px 14px 40px}
.screen.on{display:block}
#gate{min-height:100vh;text-align:center}
#gate.on{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#gate svg{width:min(380px,86%);height:auto}
#gate h1{font-size:clamp(2rem,7vw,3.2rem);color:var(--pink)}
.hint{color:var(--soft);margin:0}
form{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:100%;max-width:460px}
input{flex:1 1 220px;font:inherit;font-size:1.1rem;padding:14px 16px;border:2px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);text-align:center}
button{font:800 1.05rem Nunito,sans-serif;padding:14px 26px;border-radius:999px;border:0;cursor:pointer;background:var(--sun);color:#3a2a00}
button.link{background:none;color:var(--soft);text-decoration:underline;padding:8px;font-weight:700}
input:focus-visible,button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
#msg{min-height:1.7em;color:var(--pink);font-weight:800;margin:0}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#card h1{font-size:clamp(2.4rem,9vw,4.6rem);color:var(--pink);padding-top:8px}
#card svg.sc{width:100%;height:auto;display:block;border-radius:28px;box-shadow:0 10px 0 var(--sun);margin-top:14px}
.reveal #card svg.sc{animation:pop .9s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.88);opacity:0}}
.balloon{animation:bob 4s ease-in-out infinite;transform-origin:500px 300px}
@keyframes bob{50%{transform:rotate(4deg)}}
.words{position:relative;background:var(--card);border:3px dashed var(--pink);border-radius:26px;padding:28px 24px;margin:40px auto 0;max-width:680px;text-align:center}
.words p{margin:0;font-family:Pacifico,"Comic Sans MS",cursive;font-size:clamp(1.3rem,4.4vw,1.9rem);line-height:1.5}
.words .sign{font-family:Nunito,sans-serif;font-weight:800;color:var(--soft);font-size:1.1rem;margin-top:14px}
.words .hrt{position:absolute;top:-24px;left:50%;margin-left:-24px}
.more{text-align:center;margin-top:24px}
.fl{position:fixed;top:-40px;pointer-events:none;animation:fall linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(115vh) rotate(300deg)}}
@media (prefers-reduced-motion:reduce){.balloon,.reveal #card svg.sc,.shake{animation:none}}
</style>
</head>
<body>

<main id="gate" class="screen on">
<svg viewBox="0 0 300 210" role="img" aria-label="Закрытый конверт с сердечком">
<rect x="20" y="50" width="260" height="150" rx="16" fill="#FFE08A"/>
<path d="M20 66Q20 50 36 50H264Q280 50 280 66L150 142Z" fill="#FFC93C"/>
<path d="M20 190L120 120M280 190L180 120" stroke="#F2B400" stroke-width="3" fill="none"/>
<path d="M150 168C132 152 138 134 150 144C162 134 168 152 150 168Z" fill="#FF5C7A" transform="translate(0 -16) scale(1 1)"/>
<g fill="#FF8FA3"><circle cx="40" cy="30" r="5"/><circle cx="262" cy="22" r="6"/><circle cx="150" cy="16" r="4"/></g>
</svg>
<h1>Какой сегодня праздник?</h1>
<p class="hint">Ответь, и конверт откроется</p>
<form id="f" autocomplete="off">
<input id="ans" aria-label="Ответ" placeholder="Напиши ответ здесь" maxlength="40">
<button type="submit">Открыть</button>
</form>
<p id="msg" role="status"></p>
<button id="show" class="link" type="button" hidden>Показать ответ</button>
</main>

<main id="card" class="screen">
<h1>С Днём отца!</h1>

<ellipse cx="310" cy="410" rx="400" ry="72" fill="#9ADBA8"/><ellipse cx="120" cy="415" rx="260" ry="50" fill="#84CF98"/>

<path d="M279 114Q285 110 291 113M309 113Q315 110 321 114" stroke="#2b2b38" stroke-width="2" fill="none"/>

<path d="M289 140Q300 152 311 140Z" fill="#E0546B"/>

<ellipse cx="450" cy="205" rx="39" ry="39" fill="#7A4A25"/>

<g fill="#2b2b38"><ellipse cx="437" cy="210" rx="4.2" ry="5.8"/><ellipse cx="463" cy="210" rx="4.2" ry="5.8"/></g><g fill="#fff"><circle cx="438.5" cy="207.5" r="1.7"/><circle cx="464.5" cy="207.5" r="1.7"/></g>
<g fill="#FF9AA2" opacity=".6"><circle cx="428" cy="222" r="5.5"/><circle cx="472" cy="222" r="5.5"/></g>
<path d="M442 224Q450 232 458 224" stroke="#b24a5a" stroke-width="2.4" fill="none" stroke-linecap="round"/>

<g fill="#FF5C8A"><circle cx="485" cy="330" r="4"/><path d="M485 330L472 322L472 338ZM485 330L498 322L498 338Z"/></g>

<!-- Белая кошка -->
<g>
<path d="M570 358Q602 352 594 320" fill="none" stroke="#C9D3E0" stroke-width="13" stroke-linecap="round"/><path d="M570 358Q602 352 594 320" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/>

<!-- Сердце-шарик -->
<g class="balloon"><path d="M500 300Q514 240 506 190" stroke="#1F3A5F" stroke-width="1.5" fill="none"/>
<use href="#h" transform="translate(506 165) scale(4.6)" fill="#FF5C7A"/><ellipse cx="496" cy="150" rx="5" ry="8" fill="#fff" opacity=".5" transform="rotate(30 496 150)"/></g>
<circle cx="500" cy="300" r="6.5" fill="#FFDFC4"/>
</svg>
<div class="words">
<svg class="hrt" width="48" height="48" viewBox="-14 -14 28 28" aria-hidden="true"><path d="M0 6C-12-4-6-14 0-7C6-14 12-4 0 6Z" transform="scale(2)" fill="#FF5C7A"/></svg>
<p>Папуля, ты у нас самый лучший, спасибо тебе за всё, что ты для нас делаешь! Мы любим тебя.</p>
<div class="sign">Твои девочки и наша кошка</div>
</div>
<div class="more"><button id="again" type="button">Ещё сердечек</button></div>
</main>

<script>
const $=id=>document.getElementById(id);
const norm=s=>s.toLowerCase().replace(/ё/g,"е").replace(/[^а-яa-z\s]/g,"").trim();
const calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
let tries=0;
function hearts(n){if(calm)return;const c=["#FF5C7A","#FF8FA3","#FFC93C","#5CC8B5"];
for(let k=0;k<n;k++){const h=document.createElement("span");h.className="fl";h.textContent="♥";
h.style.left=Math.random()*100+"vw";h.style.fontSize=14+Math.random()*26+"px";h.style.color=c[k%4];
h.style.animationDuration=3+Math.random()*3+"s";h.style.animationDelay=Math.random()*1.2+"s";
h.addEventListener("animationend",()=>h.remove());document.body.appendChild(h)}}
function open_(){$("gate").classList.remove("on");$("card").classList.add("on");
document.body.classList.add("reveal");scrollTo(0,0);hearts(36)}
$("f").onsubmit=e=>{e.preventDefault();const v=norm($("ans").value);
if(/(отц|отец|пап)/.test(v)){open_();return}
tries++;$("msg").textContent=v?"Почти! Подумай: этот праздник про тебя 💛":"Напиши, какой сегодня праздник";
$("ans").classList.remove("shake");void $("ans").offsetWidth;$("ans").classList.add("shake");
if(tries>=3)$("show").hidden=false};
$("show").onclick=()=>{$("ans").value="День отца";$("msg").textContent="Теперь жми «Открыть»"};
$("again").onclick=()=>hearts(30);
</script>
</body>
</html>
